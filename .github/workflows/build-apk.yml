name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Giải nén mã nguồn (nếu upload dạng zip)
        run: |
          if [ -f hero-combat.zip ]; then
            rm -rf _tmp && unzip -o hero-combat.zip -d _tmp
            cp -r _tmp/hero-combat/. .
            rm -rf _tmp
          fi
      - run: npm install
      - name: Đưa thư viện vào app (chạy không cần mạng CDN)
        run: |
          mkdir -p www/lib
          cp node_modules/three/build/three.module.js www/lib/
          cp node_modules/peerjs/dist/peerjs.min.js www/lib/
          sed -i 's#https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js#lib/three.module.js#; s#https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js#lib/peerjs.min.js#' www/index.html
      - run: npx cap add android
      - run: npx cap sync android
      - name: Khóa màn hình ngang
        run: sed -i 's/<activity /<activity android:screenOrientation="landscape" /' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ApexHeroArena-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
